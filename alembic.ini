[alembic]
script_location = migrations
prepend_sys_path = . src

# Actual connection string comes from the ATHENA_DATABASE_URL env var, read
# in migrations/env.py -- never hardcode credentials here. Falls back to the
# docker-compose.yml default (athena/athena@localhost:5432/athena) if unset,
# which is fine for local dev, not for anything else.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
