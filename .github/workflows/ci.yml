name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Offline test suite (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          # README.md notes 3.12+ is untested; pin to 3.11 until that's verified.

      - name: Install package (core + dev + api)
        run: pip install -e ".[dev,api]"
        # `api` (sqlalchemy, alembic, psycopg, fastapi, uvicorn, pydantic,
        # anthropic — see pyproject.toml) is required even for the OFFLINE
        # suite: tests/case/test_models.py imports secondlook.case.models,
        # which imports sqlalchemy at module level. Without this group,
        # collection fails with ModuleNotFoundError before any test runs,
        # regardless of the `integration` marker deselecting the live-DB
        # tests in tests/case/test_store.py.

      - name: Install offline-only structural test dependencies
        run: pip install rdkit meeko openmm pdbfixer scipy gemmi
        # A subset of the "structural" extra (see pyproject.toml) needed by
        # tests/test_audit_fixes.py, tests/test_covalent.py, and
        # tests/test_vina_dock.py. Those tests are pure offline unit tests —
        # no network, no live docking run — but without these packages
        # installed they fail with ModuleNotFoundError/ImportError instead of
        # exercising the code path. scipy and gemmi aren't imported directly
        # by our code; meeko imports them at module load time
        # (meeko.receptor_pdbqt, meeko.chemtempgen) without declaring them as
        # install dependencies. Deliberately narrower than the full
        # `structural` extra: skips vina and playwright, which nothing in the
        # offline suite needs.

      - name: Run offline unit tests
        run: pytest -q
        # Integration tests (marked @pytest.mark.integration) hit live
        # external services and a running FalkorDB instance — they are
        # deselected by default per README.md §4 and are intentionally
        # NOT run in this workflow. See docs/local-setup.md if a future
        # workflow adds a FalkorDB service container for them.

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          sed -i 's/^ATHENA_API_KEY=.*/ATHENA_API_KEY=ci-validation-only/' .env
          docker compose config --quiet
          rm .env
        # Fast, no image builds -- catches YAML syntax errors and bad
        # ${VAR} interpolation (e.g. a typo'd env var name in
        # docker-compose.yml that .env.example doesn't define) without the
        # multi-minute cost of actually building the api/web images in CI.
        # Subsystem O (Open-Source Deployment & Cost Architecture).

  evidence:
    name: PR evidence bar (issue #103)
    runs-on: ubuntu-latest
    # Only on pull requests: there is no PR body to check on a push to main.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check the evidence bar
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'EOF'
          import os, subprocess, sys
          sys.path.insert(0, "src")
          from secondlook.devtools.pr_evidence import check

          changed = subprocess.run(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          ok, message = check(os.environ.get("PR_BODY") or "", changed)
          print(message)
          sys.exit(0 if ok else 1)
          EOF
        # Enforces what issue #103 already required in prose. PR #106 merged
        # with zero reviews on a description alone, and #108, #110 and #111
        # were all cleanup a single driven run would have surfaced first.

  client:
    name: Subsystem M client (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Component tests (vitest)
        run: npm test
        working-directory: web
        # These assert contracts, not layout: which props exist, and what
        # must never render. The load-bearing one reads ComputedCard.jsx's
        # source and fails if it so much as mentions a citation —
        # IMPLEMENTATION_PLAN.md §9.2 says the computed card must have no
        # place for one, "not an empty one". The server-rendered half asserts
        # the same rule by inspect.signature in tests/web/test_render.py;
        # JavaScript has no signature to inspect, so the source is the
        # closest true analogue.

      - name: Build
        run: npm run build
        working-directory: web

      - name: Bundle budget
        run: npm run budget
        working-directory: web
        # Fails the build when the gzipped JS/CSS budget in
        # docs/performance-budget.md is exceeded, so the budget cannot age
        # into a paragraph nobody re-measures.
