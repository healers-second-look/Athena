name: CodeQL

on:
  push:
    branches: [main]
  # No `branches:` filter -- see the note in ci.yml. A stacked PR
  # needs the security scan for the same reason it needs the tests.
  pull_request:
  schedule:
    - cron: "27 3 * * 1"

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
