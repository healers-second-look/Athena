# HARNESS-DEBUG ONLY. NOT A STUDY CASE SET.
#
# Five synthetic HR+/HER2- breast cancer cases that exercise every seeded-issue
# type (and a no-issue control) so the study harness can be built and tested.
# They have NOT been reviewed by a clinician, every citation is a placeholder
# under example.org, and nothing here is clinical guidance. The loader's
# assert_eligible_for_study() refuses this set on purpose; tests pin that.
#
# The real case set replaces this file's role once a clinician has reviewed the
# medicine and the citations have been verified as real and supporting their
# claims (protocol section 5).
set_id: pilot_v0
version: 1
review_status: unreviewed
notes: "Harness-debug pilot. Unreviewed clinical content; placeholder citations."
cases:
  # ---------------------------------------------------------------- 001
  - case_id: pilot-001
    label: "Pilot 001 - synthetic"
    cancer_type: "HR+/HER2- breast cancer"
    age_years: 58
    stage: "IV"
    recall_distractors:
      - "New brain metastasis identified"
      - "Adjuvant chemotherapy completed"
    synthetic: true
    citations_verified: false
    baseline_events:
      - {id: p1-b1, occurred_on: "2023-03-10", event_type: BIOMARKER_MEASURED, summary: "ER 95% positive, PR 60% positive, HER2 IHC 1+ (negative)", source_document: "Pathology report 2023-03-10", payload: {name: ER, value: 95, unit: "% positive"}}
      - {id: p1-b2, occurred_on: "2023-04-02", event_type: TREATMENT_LINE, summary: "Adjuvant letrozole started", payload: {regimen: letrozole, line: 1, action: started}}
    update_events:
      - {id: p1-u1, occurred_on: "2026-01-15", event_type: ALTERATION_OBSERVED, summary: "ESR1 Y537S detected on ctDNA", source_document: "ctDNA report 2026-01-15", payload: {gene: ESR1, variant: Y537S}}
      - {id: p1-u2, occurred_on: "2026-01-15", event_type: DISEASE_ASSESSMENT, summary: "Bone-predominant recurrence on imaging", source_document: "Imaging report 2026-01-15", payload: {status: progression, sites: [bone]}}
    system_output:
      findings:
        - id: p1-f1
          claim: "Continue aromatase-inhibitor endocrine therapy: the tumour is ER-positive and HER2-negative."
          evidence_class: documented
          evidence_level: "B"
          citation: {id: SYN-P1-F1, url: "https://example.org/synthetic/p1-f1", name: "Synthetic placeholder"}
          valid: false
          invalidated_by: p1-u1
        - id: p1-f2
          claim: "A CDK4/6 inhibitor plus endocrine therapy is a standard first-line option in HR+/HER2- advanced breast cancer."
          evidence_class: documented
          evidence_level: "A"
          citation: {id: SYN-P1-F2, url: "https://example.org/synthetic/p1-f2", name: "Synthetic placeholder"}
          valid: true
        - id: p1-f3
          claim: "ESR1 ligand-binding-domain mutations are associated with acquired resistance to aromatase inhibitors."
          evidence_class: documented
          evidence_level: "B"
          citation: {id: SYN-P1-F3, url: "https://example.org/synthetic/p1-f3", name: "Synthetic placeholder"}
          valid: true
      reported_changes:
        - {kind: new_alteration, summary: "ESR1 Y537S newly observed", triggering_event: p1-u1}
        - {kind: disease_progression, summary: "disease progression recorded (bone)", triggering_event: p1-u2}
      reported_supersessions:
        - finding_id: p1-f1
          broken_assumption: "no known alteration in ESR1"
          triggering_event: p1-u1
          note: "This finding assumed no known alteration in ESR1. That is no longer true."
      questions:
        - {id: p1-q1, text: "What endocrine options remain after an ESR1 mutation on an aromatase inhibitor?"}
    seeded_issues:
      - {id: p1-i1, type: change_visible, finding_id: p1-f1, description: "The new ESR1 mutation invalidates the aromatase-inhibitor continuation finding; the system reports the supersession."}
    reference_decision:
      prompt: "Recommended next step?"
      options:
        - {id: a, text: "Continue the same aromatase inhibitor unchanged"}
        - {id: b, text: "Change the endocrine partner and add a CDK4/6 inhibitor"}
        - {id: c, text: "Stop endocrine therapy and start single-agent chemotherapy"}
        - {id: d, text: "Observe without treatment"}
      concordant: [b]
