# CIViC load scope -- which cancer types are pulled into the Tier 1 graph.
#
# This is deliberately versioned config DATA, never inline Python literals.
# RareCure rule #6 (docs/rarecure-build-reference.md SS3): RareCure's cancer
# ontology and gene panels were inline dict literals in config.py despite its
# README promising YAML files that did not exist, which made its
# cohort-inclusion logic unauditable -- nobody could diff "which diseases were
# in scope for this run" against a specific loaded result.
#
# Bump `config_version` on every scope change so a loaded graph can be traced
# back to the exact scope that produced it. The loader records this version on
# every node it writes (as source_version).
#
# Diseases are identified by Disease Ontology ID (DOID), NOT by name substring.
# RareCure rule #8: its `k in patient.cancer_type.lower()` substring check sent
# "malignant_fibrous_histiocytoma" to a default gene panel because the string
# did not contain "sarcoma", producing a wrong top drug for 42 patients.
# Matching on ontology IDs makes that class of bug impossible.
#
# `evidence_item_count` is the count CIViC reported when this entry was added.
# It is documentation of why the entry is here, not a value the loader reads.

config_version: "2026-09-18.1"
description: >-
  Evidence-graph disease scope. Soft-tissue and bone sarcomas remain in scope
  (RareCure validation cohort / Tier 2 demo). Widened for the MVP cancer type
  (issue #121) with breast-cancer DOIDs: parent breast cancer (DOID:1612) and
  the HR+/HER2- receptor-defined subtype family. Entries are added alongside
  sarcoma, not as a replacement.

# Only ACCEPTED, PREDICTIVE evidence is loaded (see civic_loader.py).
# SUBMITTED and REJECTED evidence is excluded: it has not cleared CIViC's own
# curation review, and this graph is clinical-facing.
evidence_status: ACCEPTED
evidence_type: PREDICTIVE

diseases:
