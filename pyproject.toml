[project]
name = "athena-secondlook"
version = "1.0.0"
description = "Athena / SecondLook — AI second-opinion copilot for rare and treatment-exhausted cancers"
requires-python = ">=3.11"
dependencies = [
    # Tier 2 — structural prediction
    "hgvs>=1.5",
    "httpx>=0.27",
    # Tier 1 — knowledge-graph retrieval
    "falkordb>=1.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Structural prediction. Heavy, and `vina` has no macOS arm64 wheel — see
# docs/local-setup.md before installing this group on Apple Silicon.
structural = [
    "playwright>=1.49",
    "vina>=1.2.7",
    "meeko>=0.7.1",
    "rdkit",
    "pdbfixer",
    "scipy",
    "gemmi",
]
# Mode 3 semantic retrieval. Pulls torch (~2 GB) — keep 3 GB free.
semantic = [
    "sentence-transformers>=3.0.0",
]
# Case store, diff engine, API, and synthesis (the R&D loop) — Postgres-backed,
# per IMPLEMENTATION_PLAN.md §1.1. Kept out of core `dependencies` so a caller
# that only needs Tier 1/Tier 2 never pays for FastAPI/SQLAlchemy/anthropic.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Integration tests hit live external services (Ensembl VEP, RCSB, AlphaFold DB,
# UniProt, CIViC, PubMed) and a running FalkorDB. Deselected by default so a
# plain `pytest` is fast, offline and deterministic; run them explicitly with
# `pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: hits live external APIs or a running FalkorDB",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE", "I", "UP"]
# BLE001: no bare `except:` / `except Exception:`. Every external call catches a
# specific exception type at its own call site — a repo-wide rule, not a
# preference. See docs/rarecure-build-reference.md.

[tool.black]
line-length = 100
target-version = ["py311"]
