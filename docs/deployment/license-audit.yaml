# Infrastructure images used by docker-compose.yml — not a code dependency
# in the pip/npm sense, but part of what a deployer actually runs, so
# audited the same way for the same transparency reasons.
infrastructure:
  postgres:
    license: PostgreSQL License
    source: postgres:16 (Docker Hub official image)
    checked_on: "2026-08-24"
    note: Permissive, OSI-approved, MIT/BSD-style. No restrictions relevant to this deployment.
  nginx:
    license: BSD-2-Clause
    source: nginx:1.27-alpine (web/Dockerfile)
    checked_on: "2026-08-24"
  falkordb-server:
    license: SSPL-1.0 (Server Side Public License)
    source: falkordb/falkordb:latest (Docker Hub)
    checked_on: "2026-08-24"
    note: >
      IMPORTANT — distinct from the `falkordb` PYTHON CLIENT above, which
      is separately MIT-licensed. The FalkorDB DATABASE SERVER itself is
      SSPL-1.0, which is source-available but NOT an OSI-approved
      open-source license — its restrictive clause specifically targets
      offering FalkorDB itself as a competing hosted database service to
      third parties. Running FalkorDB as an internal backend component of
      an Athena deployment (what this docker-compose.yml does) is not
      the scenario SSPL restricts. Flagged here for transparency, not
      because it currently blocks anything: Athena's own license claims
      are about Athena's own code, not about every infrastructure
      component it happens to run alongside.
